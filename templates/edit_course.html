{% extends 'base.html' %}

{% block title %}編輯課程資訊 - {{ course.title }}{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="card card-custom p-4 shadow-sm" style="max-width: 700px; margin: 0 auto;">
        <h3 class="fw-bold text-dark mb-4">✏️ 編輯課程資訊：{{ course.title }}</h3>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">課程名稱</label>
                <input type="text" name="title" class="form-control" value="{{ course.title }}" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">上課教室</label>
                    <input type="text" name="classroom" class="form-control" value="{{ course.classroom }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">課程名額上限</label>
                    <input type="number" name="capacity" class="form-control" value="{{ course.capacity }}" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">課程簡介</label>
                <textarea name="description" class="form-control" rows="5">{{ course.description }}</textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'courses:teacher_courses' %}" class="btn btn-outline-secondary">取消並返回</a>
                <button type="submit" class="btn btn-success fw-bold">儲存更新</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
