{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <div class="card card-custom p-4 shadow-sm" style="max-width: 700px; margin: 0 auto;">
        <h3 class="fw-bold text-dark mb-4">✏️ 編輯課程資訊：{{ course.title }}</h3>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold">課程名稱</label>
                <input type="text" name="title" class="form-control" value="{{ course.title }}" required>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">上課教室 (下拉選擇)</label>
                    <select name="classroom" class="form-select" required>
                        {% for code, name in classroom_choices %}
                            <option value="{{ code }}" {% if course.classroom == code %}selected{% endif %}>
                                {{ name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">名額上限</label>
                    <input type="number" name="capacity" class="form-control" value="{{ course.capacity }}" min="1" required>
                </div>
            </div>

            <!-- 成績比例設定與即時計算 -->
            <div class="card bg-light p-3 border mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold text-dark mb-0">⚖️ 成績評分比例設定</h6>
                    <span id="ratioTotalBadge" class="badge bg-success fs-6">加總：100%</span>
                </div>
                <small class="text-muted mb-3 d-block">請設定各項成績佔比，三者加總必須剛好等於 100%。</small>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">平時成績 (%)</label>
                        <input type="number" name="daily_weight" class="form-control ratio-input" value="{{ course.daily_weight }}" min="0" max="100" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">期中成績 (%)</label>
                        <input type="number" name="midterm_weight" class="form-control ratio-input" value="{{ course.midterm_weight }}" min="0" max="100" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold">期末成績 (%)</label>
                        <input type="number" name="final_weight" class="form-control ratio-input" value="{{ course.final_weight }}" min="0" max="100" required>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">課程大綱</label>
                <textarea name="description" class="form-control" rows="4">{{ course.description }}</textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'courses:teacher_courses' %}" class="btn btn-outline-secondary">取消</a>
                <button type="submit" id="submitBtn" class="btn btn-primary fw-bold px-4">儲存更新</button>
            </div>
        </form>
    </div>
</div>

<script>
    // JS 即時計算加總與開關儲存按鈕
    const inputs = document.querySelectorAll('.ratio-input');
    const badge = document.getElementById('ratioTotalBadge');
    const submitBtn = document.getElementById('submitBtn');

    function validateRatio() {
        let sum = 0;
        inputs.forEach(i => sum += parseInt(i.value) || 0);
        badge.innerText = `加總：${sum}%`;
        
        if (sum === 100) {
            badge.className = 'badge bg-success fs-6';
            submitBtn.disabled = false;
        } else {
            badge.className = 'badge bg-danger fs-6';
            submitBtn.disabled = true;
        }
    }

    inputs.forEach(i => i.addEventListener('input', validateRatio));
    validateRatio();
</script>
{% endblock %}
