{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card bg-dark text-light border-secondary">
            <div class="card-header border-secondary text-center">
                <h3>學生/使用者登入</h3>
            </div>
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-danger">
                        帳號或密碼錯誤，請重新輸入。
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">帳號 (Username)</label>
                        <input type="text" name="username" class="form-control bg-secondary text-light border-0" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">密碼 (Password)</label>
                        <input type="password" name="password" class="form-control bg-secondary text-light border-0" id="id_password" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}" />
                    <button type="submit" class="btn btn-primary w-100">登入</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
